<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .guestbook-summary {
      list-style: none;
      cursor: pointer;
      width: fit-content;
      text-decoration: underline;
    }

    .guestbook-summary::-webkit-details-marker {
      display: none;
    }

    .guestbook-summary:hover {
      color: var(--muted);
    }

    .guestbook-prompt {
      display: block;
      margin-bottom: 1em;
    }

    .guestbook-label {
      display: block;
      font-style: oblique;
    }

    .guestbook-label::after {
      content: ":";
    }

    .guestbook-input {
      display: block;
      margin-bottom: 0.4em;
    }

    .guestbook-textarea {
      display: block;
      box-sizing: border-box;
      max-width: 100%;
      margin-bottom: 0.4em;
    }

    .guestbook-button {
      display: block;
    }

    .guestbook-canvas {
      border: 1px solid black;
      cursor: crosshair;
      display: block;
      max-width: 100%;
      height: auto;
    }

    .guestbook-drawing-wrap {
      display: block;
      margin-bottom: 0.4em;
    }

    .guestbook-drawing-tools {
      display: block;
    }

    .guestbook-drawing-tools a {
      cursor: pointer;
    }

    .guestbook-drawing-content {
      display: block;
    }

    .guestbook-swatch {
      display: inline-block;
      width: 0.85em;
      height: 0.85em;
      border: 1px solid black;
      cursor: pointer;
      vertical-align: middle;
      box-sizing: border-box;
      margin: 0 1px;
    }

    .guestbook-swatch.active {
      border: 1px solid black;
      outline: 1px solid black;
    }

    .guestbook-size-slider {
      width: 4em;
      vertical-align: middle;
    }

    .entry-drawing {
      max-width: 100%;
    }

    .guestbook-voice-wrap {
      display: block;
      margin-bottom: 0.4em;
    }

    .guestbook-voice-controls a {
      cursor: pointer;
    }

    .guestbook-voice-record.recording {
      font-weight: bold;
    }

    .guestbook-voice-timer {
      font-variant-numeric: tabular-nums;
    }

    .guestbook-voice-playback:empty {
      display: none;
    }

    .guestbook-voice-playback {
      display: block;
      white-space: normal;
    }

    audio {
      display: block;
      height: 2em;
    }

    .entries {
      margin: 0;
    }

    .entries .entry-header {
      margin-top: 1.5rem;
    }

    .entries .entry-header:first-child {
      margin-top: 0;
    }

    .entry-date {
      color: var(--muted);
    }

    .entry-name {
      font-weight: bold;
    }

    .entry-body {
      white-space: pre-wrap;
    }

    .entry-drawing-wrap {
      margin-top: 0.3rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a><br>
    <a href="/links/">Links</a><br>
    <a href="/now/">Now</a><br>
    <a href="/guestbook/">Guestbook</a>
  </nav>
  <details class="guestbook-details">
    <summary class="guestbook-summary">Leave an entry</summary>
    {{form}}
  </details>
  <h1>Messages</h1>
  {{entries}}
</body>
</html>
