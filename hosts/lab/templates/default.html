<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .guestbook-summary {
      list-style: none;
      cursor: pointer;
      width: fit-content;
      text-decoration: underline;
    }

    .guestbook-summary::-webkit-details-marker {
      display: none;
    }

    .guestbook-summary:hover {
      color: var(--muted);
    }

    .guestbook-details {
      margin-bottom: 1rem;
    }

    .guestbook-prompt {
      display: block;
      margin-bottom: 1em;
    }

    .guestbook-label {
      display: block;
      font-style: oblique;
    }

    .guestbook-label::after {
      content: ":";
    }

    .guestbook-input {
      display: block;
      margin-bottom: 0.4em;
    }

    .guestbook-textarea {
      display: block;
      box-sizing: border-box;
      max-width: 100%;
      margin-bottom: 0.4em;
    }

    .guestbook-button {
      display: block;
    }

    .guestbook-canvas {
      border: 1px solid black;
      cursor: crosshair;
      display: block;
      max-width: 100%;
      height: auto;
    }

    .guestbook-drawing-wrap {
      display: block;
      margin-bottom: 0.4em;
    }

    .guestbook-drawing-tools {
      display: block;
    }

    .guestbook-drawing-tools a {
      cursor: pointer;
    }

    .guestbook-drawing-content {
      display: block;
    }

    .guestbook-swatch {
      display: inline-block;
      width: 0.85em;
      height: 0.85em;
      border: 1px solid black;
      cursor: pointer;
      vertical-align: middle;
      box-sizing: border-box;
      margin: 0 1px;
    }

    .guestbook-swatch.active {
      border: 1px solid black;
      outline: 1px solid black;
    }

    .guestbook-size-slider {
      width: 4em;
      vertical-align: middle;
    }

    .entry-drawing {
      max-width: 100%;
    }

    .guestbook-voice-wrap {
      display: block;
      margin-bottom: 0.4em;
    }

    .guestbook-voice-controls a {
      cursor: pointer;
    }

    .guestbook-voice-record.recording {
      font-weight: bold;
    }

    .guestbook-voice-timer {
      font-variant-numeric: tabular-nums;
    }

    .guestbook-voice-playback:empty {
      display: none;
    }

    .guestbook-voice-playback {
      display: block;
      white-space: normal;
    }

    audio {
      display: block;
      height: 2em;
    }

    .entries {
      margin: 0;
    }

    .entries .entry-header {
      margin-top: 1rem;
    }

    .entries .entry-header:first-child {
      margin-top: 0;
    }

    .entry-date {
      display: none;
    }

    .entry-header::after {
      content: " on " attr(title);
      color: var(--muted);
    }

    .entry-body {
      white-space: pre-wrap;
    }

    .entry-drawing-wrap {
      margin-top: 0.3rem;
    }

    .entry-attach {
      cursor: pointer;
    }

    .mascot {
      position: fixed;
      right: 2rem;
      bottom: 0;
      width: 280px;
      user-select: none;
    }

    .mascot img {
      width: 100%;
      -webkit-user-drag: none;
      user-drag: none;
    }

    @media (max-width: 700px) {
      .mascot {
        display: none;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a><br>
    <a href="/links/">Links</a><br>
    <a href="/now/">Now</a><br>
    <a href="/guestbook/">Guestbook</a>
  </nav>
  <h1>Guestbook</h1>
  <details class="guestbook-details">
    <summary class="guestbook-summary">Click here to leave an entry</summary>
    {{form}}
  </details>
  {{entries}}
  <div class="mascot"><img src="https://file.ily.rs/joi.png" alt="" draggable="false"></div>
  <script>
    (function () {
      document.querySelectorAll('.entry-drawing').forEach(function (img) {
        var name = img.getAttribute('src').split('/').pop();
        var link = document.createElement('a');
        link.href = '#';
        link.className = 'entry-attach';
        link.textContent = '[attached: ' + name + ']';
        img.style.display = 'none';
        link.addEventListener('click', function (e) {
          e.preventDefault();
          img.style.display = (img.style.display === 'none') ? 'block' : 'none';
        });
        img.parentNode.insertBefore(link, img);
      });
    })();
  </script>
</body>
</html>
