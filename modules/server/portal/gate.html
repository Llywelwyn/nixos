<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>wynne</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; height: 100dvh; display: flex; align-items: center; justify-content: center; background: #fff; }
  form { display: flex; gap: 0.75rem; }
  input { width: 3rem; height: 3.75rem; border: 1px solid #000; border-radius: 0; background: #fff; color: #000; font-size: 1.5rem; font-family: inherit; text-align: center; }
  input:focus { outline: 2px solid #000; outline-offset: -2px; }
</style>
</head>
<body>
<form autocomplete="off">
  <input inputmode="numeric" maxlength="4" autofocus>
  <input inputmode="numeric" maxlength="4">
  <input inputmode="numeric" maxlength="4">
  <input inputmode="numeric" maxlength="4">
</form>
<script>
  const boxes = [...document.querySelectorAll("input")];
  boxes.forEach((box, i) => {
    box.addEventListener("input", () => {
      const digits = box.value.replace(/\D/g, "");
      box.value = "";
      digits.slice(0, 4 - i).split("").forEach((d, j) => boxes[i + j].value = d);
      boxes[Math.min(i + Math.max(digits.length, 1), 3)].focus();
      if (boxes.every(b => b.value)) {
        document.cookie = "pin=" + boxes.map(b => b.value).join("") + "; max-age=31536000; path=/; secure; samesite=lax";
        location.reload();
      }
    });
    box.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !box.value && i > 0) {
        boxes[i - 1].value = "";
        boxes[i - 1].focus();
        e.preventDefault();
      }
    });
  });
</script>
</body>
</html>
